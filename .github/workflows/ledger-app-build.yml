name: Build HCRN Ledger App

# Manual (and tag) builds — produces sideload .hex via Ledger’s official
# app-builder image. Prefer local `./build.sh` when Docker is available.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Device target'
        required: false
        default: 'nano_sp'
        type: choice
        options:
          - nano_s
          - nano_x
          - nano_sp
          - stax
      attach_to_latest_release:
        description: 'Upload .hex/.elf to the latest GitHub Release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BUILDER_IMAGE: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host test
        run: |
          cc -std=c99 -Wall -Wextra -Werror -I src tests/host/test_sighash.c src/sighash.c src/payload.c -o host_test
          ./host_test

  build:
    needs: host-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: tgt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          else
            TARGET="nano_sp"
          fi
          case "$TARGET" in
            nano_s)  SDK_VAR="NANOS_SDK" ;;
            nano_x)  SDK_VAR="NANOX_SDK" ;;
            nano_sp) SDK_VAR="NANOSP_SDK" ;;
            stax)    SDK_VAR="STAX_SDK" ;;
            *) echo "unknown target $TARGET"; exit 1 ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sdk_var=$SDK_VAR" >> "$GITHUB_OUTPUT"

      - name: Pull Ledger app-builder
        run: docker pull "$BUILDER_IMAGE"

      - name: Build with BOLOS (Docker)
        env:
          SDK_VAR: ${{ steps.tgt.outputs.sdk_var }}
        run: |
          # Keep image toolchain intact: CC=clang alone made `as` fall back to
          # host GNU as (rejects -mcpu=cortex-m35p). Use clang for both CC and AS.
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/app -w /app \
            "$BUILDER_IMAGE" \
            bash -lc "set -euo pipefail; export BOLOS_SDK=\${$SDK_VAR}; export CC=clang AS=clang; echo BOLOS_SDK=\$BOLOS_SDK; make clean; make; ls -la bin/app.hex bin/app.elf"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hcrn-ledger-${{ steps.tgt.outputs.target }}
          path: |
            bin/app.elf
            bin/app.hex
          retention-days: 30

      - name: Stage release assets
        run: |
          TARGET="${{ steps.tgt.outputs.target }}"
          mkdir -p dist
          cp bin/app.hex "dist/hcrn-ledger-${TARGET}.hex"
          cp bin/app.elf "dist/hcrn-ledger-${TARGET}.elf"
          (cd dist && sha256sum "hcrn-ledger-${TARGET}.hex" > "hcrn-ledger-${TARGET}.hex.sha256")

      - name: Attach to release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.attach_to_latest_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$TAG" ]; then
            echo "No release found — skip attach"
            exit 0
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "Attached to $TAG"

      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
